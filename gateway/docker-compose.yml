services:
  cache-gateway:
    build: .
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env}
      CACHE_PATH: /data/cache.sqlite3
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cache-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  cache-data:
