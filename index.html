<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой ИИ-Агент</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">

    <!-- Шапка -->
    <header class="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
        <h1 class="font-bold text-lg">AI Assistant & Research</h1>
        <button onclick="toggleSettings()" class="text-sm bg-gray-700 px-3 py-1 rounded">⚙️ Настройки</button>
    </header>

    <!-- Модальное окно настроек ключей -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-75 p-6 flex flex-col justify-center">
        <div class="bg-gray-800 p-6 rounded-lg max-w-sm mx-auto w-full">
            <h2 class="text-xl font-bold mb-4">Настройки ключей</h2>
            <label class="block text-xs mb-1">OpenRouter API Key:</label>
            <input type="password" id="openrouterKey" class="w-full p-2 mb-3 bg-gray-700 rounded text-sm">
            <label class="block text-xs mb-1">Tavily Search API Key:</label>
            <input type="password" id="tavilyKey" class="w-full p-2 mb-4 bg-gray-700 rounded text-sm">
            <button onclick="saveKeys()" class="w-full bg-blue-600 py-2 rounded font-bold">Сохранить</button>
        </div>
    </div>

    <!-- Чат-контейнер -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <!-- Поле ввода -->
    <div class="p-4 bg-gray-800 border-t border-gray-700 flex gap-2">
        <input type="text" id="userInput" placeholder="Задайте вопрос или попросите найти в сети..." class="flex-1 bg-gray-700 p-3 rounded-lg text-sm outline-none">
        <button onclick="sendMessage()" class="bg-blue-600 px-5 rounded-lg font-bold text-sm">Отправить</button>
    </div>

    <script>
        // Инициализация истории из локальной памяти iPhone
        let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];

        window.onload = () => {
            document.getElementById('openrouterKey').value = localStorage.getItem('openrouter_key') || '';
            document.getElementById('tavilyKey').value = localStorage.getItem('tavily_key') || '';
            renderHistory();
        };

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveKeys() {
            localStorage.setItem('openrouter_key', document.getElementById('openrouterKey').value);
            localStorage.setItem('tavily_key', document.getElementById('tavilyKey').value);
            toggleSettings();
            alert('Ключи сохранены!');
        }

        function renderHistory() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.role === 'user' ? 'text-right' : 'text-left';
                div.innerHTML = `<div class="inline-block p-3 rounded-lg max-w-[85%] ${msg.role === 'user' ? 'bg-blue-600' : 'bg-gray-700'}">${msg.content}</div>`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function performSearch(query) {
            const tavilyKey = localStorage.getItem('tavily_key');
            if (!tavilyKey) return null;

            try {
                const response = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: tavilyKey, query: query, search_depth: "basic" })
                });
                const data = await response.json();
                return data.results.map(r => `[Источник: ${r.title}](${r.url})\n${r.content}`).join('\n\n');
            } catch (e) {
                return null;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const openrouterKey = localStorage.getItem('openrouter_key');
            if (!openrouterKey) {
                alert('Пожалуйста, укажите OpenRouter API Key в настройках!');
                return;
            }

            // Добавляем сообщение пользователя
            chatHistory.push({ role: 'user', content: text });
            input.value = '';
            renderHistory();

            // Проверка на необходимость веб-поиска (Агент-Ресерчер)
            let context = "";
            if (text.toLowerCase().includes("найди") || text.toLowerCase().includes("поиск") || text.toLowerCase().includes("актуальн")) {
                chatHistory.push({ role: 'assistant', content: '🔎 *Ищу информацию в интернете...*' });
                renderHistory();
                const searchData = await performSearch(text);
                chatHistory.pop(); // Удаляем статус поиска
                if (searchData) {
                    context = `\n\nДанные из интернета:\n${searchData}`;
                }
            }

            // Запрос к модели
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${openrouterKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'meta-llama/llama-3.2-3b-instruct:free',
                        messages: [
                            { role: 'system', content: 'Ты умный мультиагентный ассистент. Используй предоставленный контекст из сети для точного ответа.' },
                            ...chatHistory.slice(-6),
                            ...(context ? [{ role: 'user', content: `Контекст: ${context}` }] : [])
                        ]
                    })
                });

                const result = await response.json();
                const reply = result.choices[0].message.content;

                chatHistory.push({ role: 'assistant', content: reply });
                localStorage.setItem('chat_history', JSON.stringify(chatHistory));
                renderHistory();
            } catch (err) {
                alert('Ошибка выполнения запроса. Проверьте API ключи.');
            }
        }
    </script>
</body>
</html>
